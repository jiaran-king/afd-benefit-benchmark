name: Offline evidence and reproduction checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/recompute_results.py
      - run: python scripts/recompute_results.py --result-set 2026-10-11
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_publication.py
